{% extends "base.html" %}
{% block title %}Добавить студента{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/students" class="btn btn-outline-secondary btn-back">
        <i class="bi bi-arrow-left"></i> Назад к списку
    </a>
    <h2>➕ Добавление студента</h2>
</div>

<div class="card">
    <div class="card-header">📝 Данные студента</div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">👤 ФИО *</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">📚 Группа</label>
                    <input type="text" name="group_name" class="form-control" placeholder="ИС-302">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">🎂 Дата рождения</label>
                    <input type="date" name="birth_date" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">📞 Телефон</label>
                    <input type="text" name="phone" class="form-control" placeholder="+79001234567">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">🩸 Группа крови</label>
                    <select name="blood_type" class="form-select">
                        <option value="">Не указана</option>
                        <option value="I+">I+</option>
                        <option value="I-">I-</option>
                        <option value="II+">II+</option>
                        <option value="II-">II-</option>
                        <option value="III+">III+</option>
                        <option value="III-">III-</option>
                        <option value="IV+">IV+</option>
                        <option value="IV-">IV-</option>
                    </select>
                </div>
                <div class="col-md-8 mb-3">
                    <label class="form-label">🤧 Аллергии</label>
                    <input type="text" name="allergies" class="form-control" placeholder="Например: пенициллин, орехи">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">📋 Медицинские заметки</label>
                <textarea name="medical_notes" class="form-control" rows="2" placeholder="Хронические заболевания, противопоказания..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a href="/students" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
