{% extends "base.html" %}
{% block title %}Редактировать вакцину{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/vaccines" class="btn btn-outline-secondary btn-back">
        <i class="bi bi-arrow-left"></i> Назад к списку
    </a>
    <h2>✏️ Редактирование: {{ vaccine.name }}</h2>
</div>

<div class="card">
    <div class="card-header">📝 Данные вакцины</div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">💊 Название *</label>
                <input type="text" name="name" class="form-control" value="{{ vaccine.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">📝 Описание</label>
                <textarea name="description" class="form-control" rows="2">{{ vaccine.description or '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">📅 Периодичность (лет)</label>
                    <input type="number" name="period_years" class="form-control" value="{{ vaccine.period_years }}" min="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">📅 Периодичность (месяцев)</label>
                    <input type="number" name="period_months" class="form-control" value="{{ vaccine.period_months }}" min="0">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a href="/vaccines" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
