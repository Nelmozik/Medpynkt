{% extends "base.html" %}
{% block title %}Отметить прививку{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/students" class="btn btn-outline-secondary btn-back">
        <i class="bi bi-arrow-left"></i> Назад к списку
    </a>
    <h2>💉 Прививка для: {{ student.full_name }}</h2>
</div>

<div class="card">
    <div class="card-header">📝 Регистрация прививки</div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">💊 Вакцина *</label>
                <select name="vaccine_id" class="form-select" required>
                    <option value="">Выберите вакцину</option>
                    {% for vaccine in vaccines %}
                        <option value="{{ vaccine.id }}">{{ vaccine.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">📅 Дата проведения</label>
                <input type="date" name="date_given" class="form-control" value="{{ today }}">
            </div>
            <div class="mb-3">
                <label class="form-label">📝 Примечания</label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Серия, доза, реакция..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a href="/students" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
